<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceScribe 声记 · 语音转文字工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ======= 顶部栏 ======= -->
    <header class="topbar">
      <a class="brand" id="brandHome" href="javascript:void(0)">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="4" y1="10" x2="4" y2="14"/><line x1="8" y1="7" x2="8" y2="17"/>
            <line x1="12" y1="4" x2="12" y2="20"/><line x1="16" y1="7" x2="16" y2="17"/>
            <line x1="20" y1="10" x2="20" y2="14"/>
          </svg>
        </span>
        <span class="brand-name">VoiceScribe <em>声记</em></span>
      </a>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="btnImport">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/>
          </svg>
          导入文件
        </button>
      </div>
    </header>

    <div class="alert alert-error" id="error"></div>

    <!-- ======= 视图：首页 ======= -->
    <main id="viewHome" class="view">

      <!-- 模板区 -->
      <section class="templates">
        <div class="section-head">
          <h2 class="section-title">选择模板发起闪记</h2>
          <a class="more-link" href="javascript:void(0)">更多模板
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </a>
        </div>
        <div class="template-grid">
          <button class="tpl-card tpl-meeting" data-template="meeting">
            <span class="tpl-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/><path d="m9 15 2 2 4-4"/>
              </svg>
            </span>
            <span class="tpl-title">会议纪要</span>
            <span class="tpl-desc">帮我智能总结会议内容生成待办</span>
          </button>
          <button class="tpl-card tpl-transcribe" data-template="transcribe">
            <span class="tpl-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7V5h16v2M12 5v14M9 19h6"/>
              </svg>
            </span>
            <span class="tpl-title">语音转写</span>
            <span class="tpl-desc">音频转文字，一字不落精准记录</span>
          </button>
          <button class="tpl-card tpl-slice" data-template="slice">
            <span class="tpl-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/>
                <path d="M8.2 10.8 15.8 7.2M8.2 13.2l7.6 3.6"/>
              </svg>
            </span>
            <span class="tpl-title">长音频切片</span>
            <span class="tpl-desc">长录音智能识别事件边界并切分</span>
          </button>
          <button class="tpl-card tpl-report" data-template="report">
            <span class="tpl-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21h18"/><rect x="5" y="12" width="3.5" height="6" rx="1"/><rect x="10.2" y="8" width="3.5" height="10" rx="1"/><rect x="15.5" y="4" width="3.5" height="14" rx="1"/>
              </svg>
            </span>
            <span class="tpl-title">可视化报告</span>
            <span class="tpl-desc">自动识别场景，可视化渲染内容</span>
          </button>
        </div>
      </section>

      <!-- 记录区 -->
      <section class="records">
        <div class="toolbar">
          <nav class="tabs" id="tabs">
            <button class="tab active" data-tab="recent">最近</button>
            <button class="tab" data-tab="mine">我的</button>
            <button class="tab" data-tab="shared" disabled>共享</button>
            <button class="tab" data-tab="fav">收藏</button>
          </nav>
          <div class="toolbar-right">
            <div class="search-box">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="searchInput" placeholder="搜索记录…" autocomplete="off">
            </div>
            <div class="view-toggle" id="viewToggle" role="group" aria-label="视图切换">
              <button class="vt-btn active" data-mode="list" title="列表视图">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
              <button class="vt-btn" data-mode="grid" title="网格视图">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="records-head">
          <span class="rh-title">全部</span>
          <span class="rh-col rh-time">创建时间</span>
          <span class="rh-col rh-dur">时长</span>
          <span class="rh-col rh-src">来源</span>
          <span class="rh-col rh-size">大小</span>
        </div>

        <div class="records-body" id="recordsBody">
          <div class="list-loading" id="listLoading"><div class="loading-fill"></div></div>
          <!-- JS 渲染 -->
        </div>
        <div class="load-more-wrap">
          <button class="btn btn-ghost" id="btnLoadMore" style="display:none">加载更多</button>
        </div>
      </section>
    </main>

    <!-- ======= 视图：新建（上传） ======= -->
    <main id="viewNew" class="view" hidden>
      <div class="view-head">
        <button class="btn btn-back" id="btnBackNew">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
          返回
        </button>
        <h2 class="view-title" id="newViewTitle">发起闪记</h2>
      </div>

      <section class="card">
        <div class="upload-zone" id="uploadArea">
          <svg class="upload-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v10"/><path d="m8 6 4-4 4 4"/><path d="M20 17v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/>
          </svg>
          <p class="upload-label">拖拽文件到此处，或 <span>浏览文件</span></p>
          <p class="upload-hint">mp3 / wav / m4a / ogg / flac / webm / mp4 &middot; 最大 25MB</p>
          <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.mp4" hidden>
        </div>

        <div class="file-bar" id="fileInfo">
          <span class="file-name" id="fileName"></span>
          <span class="file-size" id="fileSize"></span>
          <button class="file-remove" id="btnRemove" title="移除">&times;</button>
        </div>

        <div class="controls">
          <label class="control-label" for="language">识别语言</label>
          <select id="language">
            <option value="auto">自动检测</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>

        <button class="btn btn-primary btn-start" id="btnTranscribe" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="6" y1="9" x2="6" y2="15"/><line x1="10" y1="6" x2="10" y2="18"/>
            <line x1="14" y1="4" x2="14" y2="20"/><line x1="18" y1="8" x2="18" y2="16"/>
          </svg>
          开始转写
        </button>
      </section>

      <div class="loading-bar" id="loading">
        <div class="loading-track"><div class="loading-fill"></div></div>
        <span>正在转写中，请稍候…</span>
      </div>
    </main>

    <!-- ======= 视图：详情 ======= -->
    <main id="viewDetail" class="view" hidden>
      <div class="view-head">
        <button class="btn btn-back" id="btnBackDetail">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
          返回
        </button>
        <div class="view-head-main">
          <h2 class="view-title" id="detailTitle">—</h2>
          <button class="icon-btn" id="btnFav" title="收藏">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.7 6.3.8-4.6 4.3 1.2 6.2L12 17l-5.6 3 1.2-6.2L3 9.5l6.3-.8Z"/></svg>
          </button>
          <button class="icon-btn danger" id="btnDelete" title="删除">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m3 0-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7"/></svg>
          </button>
        </div>
      </div>

      <div class="detail-meta" id="detailMeta"></div>

      <section class="card result-card">
        <div class="card-head">
          <span class="card-label">识别结果</span>
          <button class="btn btn-ghost" id="btnCopy">复制</button>
        </div>
        <div class="card-body" id="resultText"></div>
        <div class="card-foot" id="usageInfo"></div>
      </section>

      <div class="loading-bar" id="summaryLoading">
        <div class="loading-track"><div class="loading-fill"></div></div>
        <span>正在生成会议纪要…</span>
      </div>

      <button class="btn btn-accent" id="btnSummary" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/>
        </svg>
        生成会议纪要
      </button>

      <section class="card result-card summary-card" id="summaryResult">
        <div class="card-head">
          <span class="card-label accent">会议纪要</span>
          <button class="btn btn-ghost" id="btnCopySummary">复制</button>
        </div>
        <div class="card-body" id="summaryText"></div>
      </section>
    </main>

    <footer class="foot">
      <span class="foot-wave" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i>
      </span>
      VoiceScribe 声记 — 上传音频，AI 为你转写文字、生成会议纪要
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
